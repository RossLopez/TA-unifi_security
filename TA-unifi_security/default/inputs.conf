# UniFi syslog / SIEM integration (CEF) receiver.
#
# IMPORTANT: if another app already defines [udp://5555], remove it there.
# Splunk merges same-named input stanzas across apps, and in the global context
# the app whose directory name sorts first in ASCII order wins conflicting
# settings (e.g. an app named "CUSTOM-..." beats "TA-...").
# TODO (Splunkbase): ship this disabled / as a README example only.
#
# Everything arrives as unifi:syslog; index-time transforms in props.conf then
# re-sourcetype CEF / AP / switch events and set host to the originating device.

[udp://5555]
index = unifi
sourcetype = unifi:syslog
connection_host = ip
disabled = 0
