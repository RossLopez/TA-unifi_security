###############################################################################
# TA-unifi_security props.conf
#
# Ingest sourcetype : ubiquiti:unifi  (set on your syslog input; see README)
# Index-time routing: ubiquiti:unifi:cef | ubiquiti:unifi:ap | ubiquiti:unifi:switch | ubiquiti:unifi (UDM)
###############################################################################

###############################################################################
# ubiquiti:unifi  -  index-time settings (all UniFi data enters here)
#                  + search-time for UDM / UniFi OS syslog
###############################################################################
[ubiquiti:unifi]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = ^(?:<\d+>)?
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
# UniFi devices log local time without a zone. Uncomment if your Splunk
# server's OS time zone differs from the devices' configured zone.
# TZ = America/New_York
TRANSFORMS-unifi_routing = unifi_set_host, unifi_st_syslog, unifi_st_ap, unifi_st_switch, unifi_st_cef

# ---- search time ----
KV_MODE = none
EXTRACT-unifi_syslog_header = ^(?:<\d+>)?(?:\w{3}\s+\d{1,2}\s[\d:]{8}\s\S+\s+)?\w{3}\s+\d{1,2}\s[\d:]{8}\s(?<unifi_hostname>\S+)\s(?:(?<unifi_device_tag>[A-Za-z][\w\-]*)\s)?(?<process>[\w\-\.\/]+)(?:\[(?<pid>\d+)\])?:\s+(?<message>.*)$

# dnsmasq DHCP:  DHCPACK(br4) <client-ip> <client-mac> [hostname]
EXTRACT-unifi_dhcp = dnsmasq-dhcp\[\d+\]:\s(?<dhcp_action>DHCP[A-Z]+)\((?<dhcp_interface>[^)]+)\)\s(?:(?<dhcp_ip>\d{1,3}(?:\.\d{1,3}){3})\s)?(?<dhcp_mac>[0-9a-fA-F]{2}(?::[0-9a-fA-F]{2}){5})(?:\s(?<dhcp_hostname>\S+))?

# sudo:  sudo[16766]: ucs-update : PWD=/data/x ; USER=root ; COMMAND=/sbin/ubnt-tools id
EXTRACT-unifi_sudo_user = \ssudo\[\d+\]:\s+(?<sudo_user>[^\s:]+)\s:
EXTRACT-unifi_sudo_runas = \ssudo\[\d+\]:.*?\sUSER=(?<sudo_run_as>[^\s;]+)
EXTRACT-unifi_sudo_cmd = \ssudo\[\d+\]:.*?\sCOMMAND=(?<command>.+)$

# OpenSSH on UniFi OS
EXTRACT-unifi_sshd = \ssshd\[\d+\]:\s(?<ssh_result>Accepted|Failed)\s(?<ssh_method>\S+)\sfor\s(?:invalid user\s)?(?<ssh_user>\S+)\sfrom\s(?<ssh_src>\S+)\sport\s(?<ssh_src_port>\d+)
EXTRACT-unifi_ddns = \sinadyn\[\d+\]:\s(?:Update forced for alias|Updating cache for)\s(?<ddns_alias>\S+),\snew IP#\s(?<ddns_ip>\S+)

# UniFi OS firewall / NAT rule logging (iptables):
#   [PREROUTING-DNAT-3] DESCR="PortForward DNAT [web]" IN=br0 OUT= MAC=.. SRC=<src-ip> DST=<dst-ip> PROTO=TCP SPT=38364 DPT=32400
#   newer zone-based firewall rules look like [WAN_LOCAL-D-2147483647] / [LAN_IN-A-30000]
EXTRACT-unifi_fw_rule = \s\[(?<fw_rule>[A-Z][A-Z0-9_]*-[A-Z0-9_\-]+)\]\s(?:DESCR="(?<fw_descr>[^"]*)"\s)?IN=
EXTRACT-unifi_fw_in    = \]\s(?:DESCR="[^"]*"\s)?IN=(?<fw_IN>\S*)\sOUT=(?<fw_OUT>\S*)
EXTRACT-unifi_fw_mac   = \sOUT=\S*\sMAC=(?<fw_MAC>[0-9a-fA-F:]+)\s
EXTRACT-unifi_fw_src   = \sSRC=(?<fw_SRC>[0-9a-fA-F\.:]+)\sDST=(?<fw_DST>[0-9a-fA-F\.:]+)\sLEN=(?<fw_LEN>\d+)
EXTRACT-unifi_fw_proto = \sPROTO=(?<fw_PROTO>\S+)(?:\sSPT=(?<fw_SPT>\d+)\sDPT=(?<fw_DPT>\d+))?

# ---- CIM (Network_Traffic: fw rule logs, Authentication: sudo/ssh, Network_Sessions: DHCP) ----
EVAL-vendor = "Ubiquiti"
EVAL-product = "UniFi OS"
EVAL-vendor_product = "Ubiquiti UniFi OS"
EVAL-dvc = host
EVAL-rule = coalesce(fw_descr, fw_rule)
EVAL-rule_id = fw_rule
EVAL-app = case(isnotnull(fw_rule), "firewall", isnotnull(ssh_result), "ssh", isnotnull(sudo_user), "sudo", isnotnull(dhcp_action), "dhcp")
EVAL-action = case(match(fw_rule, "-(D|R|DROP|REJECT)-"), "blocked", isnotnull(fw_rule), "allowed", ssh_result=="Accepted", "success", ssh_result=="Failed", "failure", isnotnull(sudo_user), "success", dhcp_action=="DHCPACK", "added", dhcp_action=="DHCPRELEASE", "removed")
EVAL-user = coalesce(ssh_user, sudo_run_as)
EVAL-src_user = sudo_user
EVAL-src = coalesce(fw_SRC, ssh_src, dhcp_ip, if(isnotnull(sudo_user), host, null()))
EVAL-src_ip = coalesce(fw_SRC, ssh_src, dhcp_ip)
EVAL-src_port = coalesce(fw_SPT, ssh_src_port)
EVAL-src_mac = coalesce(dhcp_mac, if(len(fw_MAC)>=35, substr(fw_MAC, 19, 17), null()))
EVAL-src_nt_host = if(dhcp_hostname=="*", null(), dhcp_hostname)
EVAL-src_interface = fw_IN
EVAL-dest = coalesce(fw_DST, host)
EVAL-dest_ip = fw_DST
EVAL-dest_port = fw_DPT
EVAL-dest_interface = fw_OUT
EVAL-transport = lower(fw_PROTO)
EVAL-protocol = if(isnotnull(fw_PROTO), "ip", null())
EVAL-bytes = fw_LEN
EVAL-signature = case(isnotnull(fw_rule), coalesce(fw_descr, fw_rule), isnotnull(ssh_result), "SSH ".ssh_result." ".ssh_method, isnotnull(sudo_user), "sudo", isnotnull(dhcp_action), dhcp_action)
EVAL-authentication_method = ssh_method


###############################################################################
# ubiquiti:unifi:cef  -  UniFi SIEM integration (UniFi Network / UniFi OS / UniFi Protect)
###############################################################################
[ubiquiti:unifi:cef]
KV_MODE = none
REPORT-unifi_cef = unifi_cef_header, unifi_cef_extension
LOOKUP-unifi_cef_catalog = unifi_cef_event_catalog cef_product cef_signature_id OUTPUTNEW unifi_event_class, cim_datamodel

FIELDALIAS-unifi_cef_ports    = spt AS src_port dpt AS dest_port
FIELDALIAS-unifi_cef_volume   = UNIFItotalBytes AS bytes UNIFItotalPackets AS packets UNIFIbytesSent AS bytes_out UNIFIbytesReceived AS bytes_in UNIFIpacketsSent AS packets_out UNIFIpacketsReceived AS packets_in
FIELDALIAS-unifi_cef_policy   = UNIFIpolicyType AS rule_type UNIFIsrcZone AS src_zone UNIFIdstZone AS dest_zone UNIFIdstDomain AS dest_domain UNIFIsrcRegion AS src_region UNIFIdstRegion AS dest_region
FIELDALIAS-unifi_cef_session  = UNIFIipsSessionId AS session_id UNIFInetworkName AS network_name UNIFInetworkVlan AS vlan UNIFIwifiName AS ssid
FIELDALIAS-unifi_cef_iface    = UNIFIdeviceInboundInterface AS src_interface UNIFIdeviceOutboundInterface AS dest_interface

EVAL-msg            = trim(msg, "\" ")
EVAL-vendor         = "Ubiquiti"
EVAL-product        = cef_product
EVAL-vendor_product = "Ubiquiti ".cef_product
EVAL-dvc            = coalesce(UNIFIdeviceName, if(UNIFIhost=="Host", null(), UNIFIhost), host)
EVAL-client_name    = coalesce(UNIFIsrcClientAlias, UNIFIclientAlias)
EVAL-src            = coalesce(src, UNIFIsrcClientIp, UNIFIclientIp, if(match(msg, "Source IP: [0-9]"), replace(msg, "^.*Source IP: ([^ ]+).*$", "\1"), null()))
EVAL-src_ip         = coalesce(src, UNIFIsrcClientIp, UNIFIclientIp, if(match(msg, "Source IP: [0-9]"), replace(msg, "^.*Source IP: ([^ ]+).*$", "\1"), null()))
EVAL-src_mac        = lower(coalesce(UNIFIsrcClientMac, UNIFIclientMac))
EVAL-src_nt_host    = coalesce(UNIFIsrcClientHostname, UNIFIclientHostname)
EVAL-dest           = coalesce(dst, UNIFIconnectedToDeviceName, UNIFIlastConnectedToDeviceName, UNIFIdeviceName, if(UNIFIhost=="Host", null(), UNIFIhost))
EVAL-dest_ip        = coalesce(dst, UNIFIconnectedToDeviceIp, UNIFIlastConnectedToDeviceIp)
EVAL-transport      = lower(proto)
EVAL-protocol       = if(isnotnull(proto), "ip", null())
EVAL-direction      = case(UNIFIdirection=="incoming", "inbound", UNIFIdirection=="outgoing", "outbound", true(), UNIFIdirection)
EVAL-user           = UNIFIadmin
EVAL-signature      = coalesce(UNIFIipsSignature, cef_name)
EVAL-signature_id   = coalesce(UNIFIipsSignatureId, cef_signature_id)
EVAL-category       = case(cef_signature_id=="200", UNIFIpolicyName, cef_signature_id=="529", "rogue_ap", true(), coalesce(UNIFIcategory, category))
EVAL-ids_type       = case(cef_signature_id=="200", "network", cef_signature_id=="529", "wireless")
EVAL-app            = case(in(cef_signature_id, "544", "1000"), "unifi:".UNIFIaccessMethod, isnotnull(app), app, true(), cef_product)
EVAL-severity       = coalesce(lower(UNIFIrisk), case(tonumber(cef_severity)>=9, "critical", tonumber(cef_severity)>=7, "high", tonumber(cef_severity)>=4, "medium", tonumber(cef_severity)>=2, "low", isnotnull(cef_severity), "informational"))
EVAL-severity_id    = cef_severity
EVAL-action         = case(act=="blocked", "blocked", act=="allowed", "allowed", isnotnull(act), act, in(cef_signature_id, "544", "1000"), "success", in(cef_signature_id, "400", "402", "403"), "added", in(cef_signature_id, "401", "404"), "removed")
EVAL-duration       = UNIFIduration
EVAL-rule           = coalesce(if(len(UNIFIpolicyName)>0, UNIFIpolicyName, null()), UNIFIpolicyType)


###############################################################################
# ubiquiti:unifi:ap  -  UniFi access points
#   aabbccddee01,U6-Pro-6.8.2+15592: hostapd[3808]: wifi0ap1: STA 80:48:.. IEEE 802.11: authenticated
###############################################################################
[ubiquiti:unifi:ap]
KV_MODE = none
EXTRACT-unifi_ap_header = \s(?<device_mac_raw>[0-9a-fA-F]{12}),(?<device_model>[\w\.\-]+?)-(?<device_firmware>\d+\.\d+\.\d+(?:[\.\+]\d+)?):\s+(?:[\w\-\.\/]+:\s+(?=[\w\-\.\/]+\[\d+\]:))?(?<process>[\w\-\.\/]+)(?:\[(?<pid>\d+)\])?:\s+(?<message>.*)$
EXTRACT-unifi_hostapd = hostapd\[\d+\]:\s(?<vap>\S+):\sSTA\s(?<sta_mac>[0-9a-fA-F:]{17})\s(?<hostapd_event>.+)$
EXTRACT-unifi_stahtd_json = stahtd_dump_event\(\):\s+(?<stahtd_json>\{.*\})

EVAL-vendor         = "Ubiquiti"
EVAL-product        = "UniFi Access Point"
EVAL-vendor_product = "Ubiquiti UniFi Access Point"
EVAL-device_mac     = lower(substr(device_mac_raw,1,2).":".substr(device_mac_raw,3,2).":".substr(device_mac_raw,5,2).":".substr(device_mac_raw,7,2).":".substr(device_mac_raw,9,2).":".substr(device_mac_raw,11,2))
EVAL-dvc            = host
EVAL-dest           = host
EVAL-sta_message_type = spath(stahtd_json, "message_type")
EVAL-sta_event_type = spath(stahtd_json, "event_type")
EVAL-sta_vap        = coalesce(spath(stahtd_json, "vap"), vap)
EVAL-sta_mac        = lower(coalesce(spath(stahtd_json, "mac"), sta_mac))
EVAL-sta_auth_failures = spath(stahtd_json, "auth_failures")
EVAL-sta_assoc_status = spath(stahtd_json, "assoc_status")
EVAL-reason         = spath(stahtd_json, "sta_dc_reason")
EVAL-src            = lower(coalesce(spath(stahtd_json, "mac"), sta_mac))
EVAL-src_mac        = lower(coalesce(spath(stahtd_json, "mac"), sta_mac))
EVAL-user           = lower(coalesce(spath(stahtd_json, "mac"), sta_mac))
EVAL-app            = if(isnotnull(stahtd_json), "wifi", null())
EVAL-action         = case(spath(stahtd_json, "event_type")=="failure", "failure", spath(stahtd_json, "event_type")=="success", "success")
EVAL-signature      = if(isnotnull(stahtd_json), "WiFi association ".spath(stahtd_json, "event_type"), null())


###############################################################################
# ubiquiti:unifi:switch  -  UniFi switches
###############################################################################
[ubiquiti:unifi:switch]
KV_MODE = none
EXTRACT-unifi_switch_header = \s(?<device_mac_raw>[0-9a-fA-F]{12}),(?<device_model>[\w\.\-]+?)-(?<device_firmware>\d+\.\d+\.\d+(?:[\.\+]\d+)?):\s+(?<process>[\w\-\.\/]+)(?:\[(?<pid>\d+)\])?:\s+(?<message>.*)$
EXTRACT-unifi_switch_subsys = :\sswitch:\s(?<switch_subsystem>[A-Z_]+):
EVAL-vendor         = "Ubiquiti"
EVAL-product        = "UniFi Switch"
EVAL-vendor_product = "Ubiquiti UniFi Switch"
EVAL-device_mac     = lower(substr(device_mac_raw,1,2).":".substr(device_mac_raw,3,2).":".substr(device_mac_raw,5,2).":".substr(device_mac_raw,7,2).":".substr(device_mac_raw,9,2).":".substr(device_mac_raw,11,2))
EVAL-dvc            = host
