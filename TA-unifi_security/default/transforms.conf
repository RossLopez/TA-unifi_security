###############################################################################
# INDEX-TIME: host + sourcetype routing (applied to ubiquiti:unifi at ingest)
#
# Raw events may carry one or two syslog headers (relay + device), e.g.
#   Oct 27 22:26:37 <relay-ip> Oct 27 22:26:37 <switch-ip> aabbccddee03,US-8-60W-7.5.15+17146: switch: ...
#   Oct 27 22:26:02 unifi DreamMachinePro mcad[4667]: ...
# The device is always the token after the LAST header timestamp.
###############################################################################

[unifi_set_host]
REGEX = ^(?:<\d+>)?(?:\w{3}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}\s\S+\s+)?\w{3}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}\s(\S+)\s
FORMAT = host::$1
DEST_KEY = MetaData:Host

# Baseline - anything not matched below stays ubiquiti:unifi (UDM / UniFi OS)
[unifi_st_syslog]
REGEX = .
FORMAT = sourcetype::ubiquiti:unifi
DEST_KEY = MetaData:Sourcetype

# UniFi APs:  <12-hex-mac>,<model>-<fw>+<build>:   (U6-Pro, U6-Extender, UAP-AC-Pro-Gen2 ...)
[unifi_st_ap]
REGEX = \s[0-9a-fA-F]{12},(?!US)[\w\.\-]+?-\d+\.\d+\.\d+(?:[\.\+]\d+)?:\s
FORMAT = sourcetype::ubiquiti:unifi:ap
DEST_KEY = MetaData:Sourcetype

# UniFi switches: model starts with US / USW / USL / USP
[unifi_st_switch]
REGEX = \s[0-9a-fA-F]{12},US[\w\.\-]*?-\d+\.\d+\.\d+(?:[\.\+]\d+)?:\s
FORMAT = sourcetype::ubiquiti:unifi:switch
DEST_KEY = MetaData:Sourcetype

# UniFi SIEM integration (Network / OS / Protect) - CEF
[unifi_st_cef]
REGEX = \sCEF:\d+\|
FORMAT = sourcetype::ubiquiti:unifi:cef
DEST_KEY = MetaData:Sourcetype


###############################################################################
# SEARCH-TIME: CEF
###############################################################################

# CEF:Version|Device Vendor|Device Product|Device Version|Signature ID|Name|Severity|
[unifi_cef_header]
REGEX = CEF:(\d+)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|
FORMAT = cef_version::$1 cef_vendor::$2 cef_product::$3 cef_product_version::$4 cef_signature_id::$5 cef_name::$6 cef_severity::$7

# CEF extension.  UniFi values contain unescaped spaces ("UNIFIclientAlias=Game Console 2"),
# so a value runs until the next " key=".  Keys keep their native names (UNIFIclientIp,
# src, dst, msg ...). Splunk does not substitute $1 inside a literal prefix, so FORMAT must be $1::$2.
[unifi_cef_extension]
REGEX = (?:\s|\|)([A-Za-z][A-Za-z0-9_]*)=(.*?)(?=\s+[A-Za-z][A-Za-z0-9_]*=|\s*$)
FORMAT = $1::$2
CLEAN_KEYS = false

[unifi_cef_event_catalog]
filename = unifi_cef_event_catalog.csv
case_sensitive_match = false


