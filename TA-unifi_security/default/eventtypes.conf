#### UniFi SIEM integration (CEF) ####
[unifi_cef]
search = sourcetype="unifi:cef"

[unifi_ips_threat]
search = sourcetype="unifi:cef" cef_product="UniFi Network" cef_signature_id=200

[unifi_firewall_block]
search = sourcetype="unifi:cef" cef_product="UniFi Network" cef_signature_id=203

[unifi_rogue_ap]
search = sourcetype="unifi:cef" cef_product="UniFi Network" cef_signature_id=529

[unifi_admin_access]
search = sourcetype="unifi:cef" ((cef_product="UniFi Network" cef_signature_id=544) OR (cef_product="UniFi OS" cef_signature_id=1000))

[unifi_client_connect]
search = sourcetype="unifi:cef" cef_product="UniFi Network" cef_signature_id IN (400, 403)

[unifi_client_disconnect]
search = sourcetype="unifi:cef" cef_product="UniFi Network" cef_signature_id IN (401, 404)

[unifi_client_roam]
search = sourcetype="unifi:cef" cef_product="UniFi Network" cef_signature_id=402

[unifi_protect_detection]
search = sourcetype="unifi:cef" cef_product="UniFi Protect"

#### UniFi OS syslog (UDM) ####
[unifi_dhcp_lease]
search = sourcetype="unifi:syslog" process="dnsmasq-dhcp" dhcp_action=DHCPACK

[unifi_sudo]
search = sourcetype="unifi:syslog" process=sudo sudo_user=*

[unifi_ssh_auth]
search = sourcetype="unifi:syslog" process=sshd ssh_result=*

[unifi_ddns_error]
search = sourcetype="unifi:syslog" process=inadyn ("Fatal error" OR "Error response" OR "HTTP 4*" OR "HTTP 5*")

#### UniFi APs ####
[unifi_wifi_auth_failure]
search = sourcetype="unifi:ap" process=stahtd sta_message_type=STA_ASSOC_TRACKER sta_event_type=failure

[unifi_wifi_auth_success]
search = sourcetype="unifi:ap" process=stahtd sta_message_type=STA_ASSOC_TRACKER sta_event_type=success

[unifi_fw_rule_log]
search = sourcetype="unifi:syslog" fw_rule=*
